[tool.pytest.ini_options]
# プロジェクトルートをPythonパスに追加（from app import app を解決するため）
pythonpath = ["."]
testpaths = ["tests"]
# E2Eテストはマーカーで分離（通常テストから除外可能）
markers = [
    "e2e: E2Eテスト（Playwright必須）",
]

[tool.ruff]
exclude = ["tests/e2e/*"]
# 個別ファイルを指定して実行しても exclude を効かせる
force-exclude = true

[tool.ruff.format]
# ruff format は使わない。コメント位置や辞書の列（_MODE_HANDLERS 等）を手で揃えており、
# 一括整形すると崩れるため。リンター（ruff check）だけを使う
exclude = ["*"]
